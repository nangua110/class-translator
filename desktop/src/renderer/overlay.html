<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>悬浮字幕</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  :root { --font: 26px; --op: .65; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  /* 半透明黑底、白字，中文稍大 */
  #bar { position: relative; margin: 0; padding: 10px 22px 12px; border-radius: 12px; color: #fff;
    background: rgba(12, 13, 20, var(--op)); cursor: grab; }
  #bar:active { cursor: grabbing; }
  .en { margin: 0; font-size: calc(var(--font) * .78); line-height: 1.35; color: rgba(255,255,255,.82);
    text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .en.low { color: rgba(255,255,255,.45); }
  .zh { margin: 2px 0 0; font-size: var(--font); line-height: 1.35; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .zh:empty { display: none; }
  .idle { color: rgba(255,255,255,.55); font-size: calc(var(--font) * .7); }
  /* 左右两边的细条：拉宽 / 拉窄 */
  .grip { position: absolute; top: 0; bottom: 0; width: 10px; cursor: ew-resize; }
  .grip.l { left: 0; } .grip.r { right: 0; }
  .grip.t { left: 12px; right: 12px; bottom: auto; width: auto; height: 8px; cursor: ns-resize; }
  /* 拉高以后：按顺序列出前面几句（每句配自己的翻译），最新的在最下面，最上面的慢慢淡出 */
  #hist { display: none; }
  body.tall #bar { height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  body.tall #hist { display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; min-height: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px); }
  body.tall #cur { position: absolute; left: 22px; right: 22px; visibility: hidden; } /* 不显示，只用来量一句话多高 */
  .row { flex: none; }
  .row .zh.wait { color: rgba(255,255,255,.4); font-weight: 400; font-size: calc(var(--font) * .6); }
  /* 鼠标移上去才出现的小按钮 */
  /* 收在字幕条右上角，不伸出去挡 PPT */
  #tools { position: absolute; top: 6px; right: 10px; display: flex; gap: 4px; z-index: 1;
    padding: 3px; border-radius: 8px; background: rgba(12, 13, 20, .85); opacity: 0; pointer-events: none; transition: opacity .15s; }
  body:hover #tools { pointer-events: auto; }
  body:hover #tools { opacity: 1; }
  #tools button, #unlock { font: 12px/1 inherit; white-space: nowrap; font-family: inherit; color: #fff; background: rgba(255,255,255,.12);
    border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  #tools button:hover, #unlock:hover { background: rgba(255,255,255,.28); }
  #unlock { position: absolute; top: 6px; right: 10px; z-index: 1; opacity: 0; transition: opacity .15s; }
  body.locked #tools, body.locked .grip { display: none; }
  body.locked #bar { cursor: default; }
  body.locked:hover #unlock { opacity: .9; }
  body:not(.locked) #unlock { display: none; }
</style>
</head>
<body>
<button id="unlock" title="解锁后可以拖动、调整">解锁</button>
<div id="bar">
  <div id="tools">
    <button data-act="font" data-v="-2" title="字小一点">A-</button>
    <button data-act="font" data-v="2" title="字大一点">A+</button>
    <button data-act="opacity" data-v="-0.15" title="背景更透明">背景淡</button>
    <button data-act="opacity" data-v="0.15" title="背景更深">背景深</button>
    <button data-act="lock" title="锁定后鼠标会直接点到下面的 PPT，不会误点到字幕">锁定</button>
    <button data-act="hide" id="hideBtn">隐藏</button>
  </div>
  <div class="grip l" data-edge="l"></div><div class="grip r" data-edge="r"></div><div class="grip t" data-edge="t" title="往上拉：多显示几句"></div>
  <div id="hist"></div>
  <div id="cur"><p class="en" id="en"></p><p class="zh" id="zh"></p></div>
</div>
<script src="overlay.js"></script>
</body>
</html>
