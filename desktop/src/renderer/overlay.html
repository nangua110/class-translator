<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>悬浮字幕</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  :root { --font: 26px; --op: .65; }
  * { box-sizing: border-box; }
  /* 窗口铺满整块屏幕、完全透明，只有字幕条看得见 */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  /* 半透明黑底、白字，中文稍大 */
  #bar { position: absolute; visibility: hidden; padding: 10px 22px 12px; border-radius: 12px; color: #fff;
    background: rgba(12, 13, 20, var(--op)); cursor: grab; }
  #bar.placed { visibility: visible; }
  #bar.dragging { cursor: grabbing; }
  .en { margin: 0; font-size: calc(var(--font) * .78); line-height: 1.35; color: rgba(255,255,255,.82);
    text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .en.low { color: rgba(255,255,255,.45); }
  .zh { margin: 2px 0 0; font-size: var(--font); line-height: 1.35; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .zh:empty { display: none; }
  .idle { color: rgba(255,255,255,.55); font-size: calc(var(--font) * .7); }
  /* 能拉的地方：左右两边拉宽、上边拉高。鼠标移到字幕上时画出来（Mac 上悬浮字幕不抢焦点，系统不会把光标换成双箭头） */
  .grip { position: absolute; top: 0; bottom: 0; width: 10px; cursor: ew-resize; z-index: 2; }
  .grip.l { left: 0; } .grip.r { right: 0; }
  .grip.t { left: 12px; right: 12px; bottom: auto; width: auto; height: 10px; cursor: ns-resize; }
  .grip::after { content: ""; position: absolute; border-radius: 3px; background: rgba(255,255,255,.35); opacity: 0; transition: opacity .15s, background .15s; }
  .grip.l::after, .grip.r::after { top: 50%; width: 4px; height: 28px; margin-top: -14px; left: 3px; }
  .grip.t::after { left: 50%; width: 44px; height: 4px; margin-left: -22px; top: 4px; }
  #bar:hover .grip::after, #bar.dragging .grip::after { opacity: 1; }
  .grip:hover::after { background: rgba(255,255,255,.8); }
  /* 拉高以后：按顺序列出前面几句（每句配自己的翻译），最新的在最下面，最上面的慢慢淡出 */
  #hist { display: none; }
  #bar.tall { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  #bar.tall #hist { display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; min-height: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px); }
  #bar.tall #cur { position: absolute; left: 22px; right: 22px; top: 0; visibility: hidden; } /* 不显示，只用来量一句话多高 */
  .row { flex: none; }
  .row .zh.wait { color: rgba(255,255,255,.4); font-weight: 400; font-size: calc(var(--font) * .6); }
  /* 收起 / 拉高切换时内容淡入，不是一下子换掉 */
  @keyframes fadein { from { opacity: 0; } }
  #bar:not(.tall) #cur, #bar.tall #hist { animation: fadein .18s ease-out; }
  /* 鼠标移上去才出现的小按钮，收在字幕条右上角 */
  #tools { position: absolute; top: 6px; right: 10px; display: flex; gap: 4px; z-index: 3;
    padding: 3px; border-radius: 8px; background: rgba(12, 13, 20, .85); opacity: 0; pointer-events: none; transition: opacity .15s; }
  #bar:hover #tools { opacity: 1; pointer-events: auto; }
  #tools button, #unlock { font: 12px/1 inherit; white-space: nowrap; font-family: inherit; color: #fff; background: rgba(255,255,255,.12);
    border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  #tools button:hover, #unlock:hover { background: rgba(255,255,255,.28); }
  #unlock { position: absolute; top: 6px; right: 10px; z-index: 3; opacity: 0; transition: opacity .15s; }
  body.locked #tools, body.locked .grip { display: none; }
  body.locked #bar { cursor: default; }
  body.locked #bar:hover #unlock { opacity: .9; }
  body:not(.locked) #unlock { display: none; }
  #bar:not(.tall) #compactBtn { display: none; }
</style>
</head>
<body>
<div id="bar">
  <button id="unlock" title="解锁后可以拖动、调整">解锁</button>
  <div id="tools">
    <button data-act="font" data-v="-2" title="字小一点">A-</button>
    <button data-act="font" data-v="2" title="字大一点">A+</button>
    <button data-act="opacity" data-v="-0.15" title="背景更透明">背景淡</button>
    <button data-act="opacity" data-v="0.15" title="背景更深">背景深</button>
    <button data-act="compact" id="compactBtn" title="回到只显示一句（也可以把上边的横条往下拉）">收起</button>
    <button data-act="lock" title="锁定后鼠标会直接点到下面的 PPT，不会误点到字幕">锁定</button>
    <button data-act="hide" id="hideBtn">隐藏</button>
  </div>
  <div class="grip l" data-edge="l"></div><div class="grip r" data-edge="r"></div><div class="grip t" data-edge="t" title="往上拉：多显示前面几句"></div>
  <div id="hist"></div>
  <div id="cur"><p class="en" id="en"></p><p class="zh" id="zh"></p></div>
</div>
<script src="overlay.js"></script>
</body>
</html>
